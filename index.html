<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f3ed">
<meta name="description" content="40 个生活小选择，看看你的相处方式更容易和哪种恋人人格产生互动。">
<title>你容易吸引什么样的恋人？ · 心动来信</title>
<style>
:root{color-scheme:light;--paper:#f9f3ed;--ink:#291e20;--muted:#6d5658;--berry:#831e3a;--dark:#5f142a;--line:#e8d8d3;--white:#fffaf6;--serif:"Songti SC","Noto Serif CJK SC","STSong","SimSun",serif;--sans:system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-width:280px;background:radial-gradient(ellipse at 83% 20%,#f3e3df 0,transparent 47%),var(--paper);color:var(--ink);font:16px/1.7 var(--sans)}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--berry);outline-offset:4px}
[hidden]{display:none!important}
.wrap{width:min(1192px,calc(100% - 104px));margin-inline:auto}
.mast{height:83px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.brand{display:inline-flex;gap:11px;align-items:center;background:none;border:0;padding:0;color:var(--dark);font-family:var(--serif);font-weight:bold;font-size:22px;letter-spacing:.12em}
.mark{display:grid;place-items:center;background:var(--berry);height:34px;width:34px;border-radius:50%;color:#fff4e4;font:20px Georgia,serif;padding-left:2px}
.english{font-family:Georgia,serif;letter-spacing:.19em;font-size:12px}
.mast .english{color:var(--berry)}
main{min-height:calc(100vh - 164px)}
.home{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(46px,7vw,108px);align-items:center;padding-block:52px 63px}
.home-copy{padding-top:2px}
.kicker{display:flex;gap:12px;align-items:center;color:var(--berry);font-size:.86rem;font-weight:700;letter-spacing:.15em;margin:0 0 22px}
.kicker::before{content:"";width:29px;height:1px;background:currentColor;flex:none}
h1,h2,h3,p{margin-top:0}
.home h1{font-family:var(--serif);font-size:clamp(44px,5.1vw,76px);line-height:1.17;letter-spacing:-.056em;margin:0 0 24px;font-weight:800}
.home h1 span{color:var(--berry);display:block}
.lead{font-size:17px;color:var(--muted);max-width:420px;margin-bottom:29px;line-height:1.85}
.facts{list-style:none;margin:0 0 32px;padding:16px 0;border-block:1px solid var(--line);display:flex;align-items:center;gap:0;max-width:418px;color:#694b50;font-size:14px}
.facts li{padding:0 15px;border-left:1px solid #e0cbc7;white-space:nowrap}
.facts li:first-child{border:0;padding-left:0}
.facts strong{font-family:Georgia,serif;font-size:21px;color:var(--berry);font-weight:400;margin-right:4px}
.primary,.secondary,.bare{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:5px;min-height:47px;padding:10px 20px;font-weight:650;line-height:1.4;text-decoration:none}
.primary{border:1px solid var(--berry);background:var(--berry);color:#fff7f1;box-shadow:0 8px 18px #711a3122}
.primary:hover{background:var(--dark);border-color:var(--dark)}
.primary:disabled,.secondary:disabled{opacity:.44}
.home .primary{min-width:221px;min-height:56px}
.secondary{background:var(--white);color:var(--dark);border:1px solid #e4cdc9}
.secondary:hover,.bare:hover{background:#f1e3de}
.bare{background:transparent;border:1px solid transparent;color:var(--berry)}
.cover{isolation:isolate;position:relative;width:min(100%,445px);aspect-ratio:3 / 4;justify-self:center;background:#581823;border-radius:6px;box-shadow:0 27px 48px #61232e36;overflow:hidden;margin:0}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:13px;border:1px solid #f8c49c66;pointer-events:none;border-radius:2px}
.cover-caption{position:absolute;inset:0;padding:30px 25px 33px;color:#ffe5c8;pointer-events:none;text-align:center}
.cover-caption strong{font:italic clamp(21px,2.6vw,37px)/1.1 Georgia,serif;font-weight:400}
.site-foot{display:flex;gap:14px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);min-height:69px;color:var(--muted);font-size:13px}
.site-foot .english{color:var(--berry);white-space:nowrap}
.screen{animation:enter .28s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.quiz{width:min(680px,100%);margin:auto;padding:47px 0 62px}
.progress-label{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:14px;margin-bottom:8px}
.progress-label b{font:27px Georgia,serif;color:var(--berry)}
.track{height:5px;border-radius:8px;background:#e9d9d5;overflow:hidden}
.track span{display:block;width:0;height:100%;background:var(--berry);border-radius:8px;transition:width .28s}
.question-box{margin-top:24px;padding:clamp(20px,5vw,43px);border-radius:8px;background:var(--white);border:1px solid var(--line);box-shadow:0 15px 34px #622d3a0b}
.question-box h1{font:700 clamp(25px,4vw,37px)/1.38 var(--serif);margin-bottom:23px;outline:none}
.options{display:grid;gap:10px}
.option{width:100%;min-height:55px;display:flex;align-items:center;text-align:left;gap:13px;padding:11px 13px;border:1px solid #ead9d3;border-radius:5px;background:#fffdfb;color:var(--ink);line-height:1.53}
.option:hover{border-color:#be8896;background:#fcf0f1}
.option[aria-pressed=true]{background:#f5e1e6;border-color:#9b4561}
.option b{display:grid;place-items:center;flex:0 0 29px;height:29px;border-radius:50%;background:#f7ece8;color:var(--berry);font:16px Georgia,serif}
.option[aria-pressed=true] b{background:var(--berry);color:white}
.quiz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:15px}
.quiz-note{margin:12px 0 0;color:var(--muted);font-size:13px;text-align:center}
.loading{display:grid;place-content:center;text-align:center;min-height:64vh;color:var(--berry)}
.loading-mark{margin:auto auto 19px;font-size:52px;animation:pulse .8s ease-in-out infinite alternate}
.loading h1{font:700 clamp(24px,5vw,46px)/1.3 var(--serif);margin:0}
@keyframes pulse{to{opacity:.4;transform:scale(.85) rotate(18deg)}}
.result{padding:54px 0 65px}
.result-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,7vw,95px);align-items:center;max-width:1010px;margin:0 auto 54px}
.result-head .kicker{margin-bottom:14px}
.result-head h1{font:800 clamp(42px,5.4vw,72px)/1.12 var(--serif);color:var(--berry);margin-bottom:15px;outline:none;letter-spacing:-.045em}
.result-head .tagline{font-size:clamp(17px,2vw,23px);font-weight:650;margin-bottom:19px}
.result-head blockquote{border-left:2px solid #d6a9ad;padding:0 0 0 15px;margin:0 0 26px;color:var(--muted)}
.result-actions{display:flex;gap:8px;flex-wrap:wrap}
.result-actions .bare{min-height:44px;padding-inline:12px}
.card-area{width:min(100%,415px);margin:0 auto}
#card{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 20px 45px #4a27383b}
.card-area figcaption{font-size:13px;color:var(--muted);margin-top:9px;text-align:center}
.details{max-width:1010px;margin:auto;scroll-margin-top:20px;outline:none}
.details>h2{font:700 clamp(29px,4vw,42px)/1.2 var(--serif);margin-bottom:20px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.panel{padding:clamp(18px,3.5vw,33px);border:1px solid var(--line);background:var(--white);border-radius:7px;overflow-wrap:anywhere}
.panel.full{grid-column:1/-1}
.panel h3{font:700 24px/1.3 var(--serif);color:var(--dark);margin-bottom:12px}
.panel p:last-child{margin-bottom:0}
.reason{margin:0;padding-left:22px}
.reason li{padding-bottom:8px}
.reason li:last-child{padding-bottom:0}
.reason strong{color:var(--dark)}
.axis-list{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.axis{display:grid;grid-template-columns:5.2em 1fr 2.2em;align-items:center;gap:9px;font-size:14px}
.axis meter{width:100%;height:12px;accent-color:var(--berry)}
.axis meter::-webkit-meter-bar{background:#eee1dc;border:0;border-radius:5px;height:6px}
.axis meter::-webkit-meter-optimum-value{background:#a95368;border-radius:5px}
.axis meter::-moz-meter-bar{background:#a95368;border-radius:5px}
.scene p{margin:0 0 5px}
.scene b{color:var(--berry)}
.second-name{font-weight:750;color:var(--berry)}
#toast{position:fixed;z-index:4;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:min(90%,420px);background:#361e27;color:#fff8f2;padding:10px 16px;border-radius:6px;font-size:14px;text-align:center;box-shadow:0 8px 25px #34212a40}
.overlay{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#26151cb3;padding:16px;overflow:auto}
.modal{width:min(420px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;padding:17px;background:var(--white);border-radius:8px;text-align:center}
.modal img{display:block;width:min(100%,330px);margin:0 auto 12px;height:auto;border-radius:4px}
.modal p{margin-bottom:12px}
.modal textarea{width:100%;height:118px;font:inherit;margin-bottom:8px;resize:vertical}
@media(max-width:840px){
  .wrap{width:calc(100% - 56px)}
  .home{gap:34px;padding-block:45px}
  .facts li{padding-inline:9px}
  .cover-caption{padding-block:24px}
}
@media(max-width:640px){
  .wrap{width:calc(100% - 36px)}
  .mast{height:61px}
  .brand{font-size:19px}
  .mark{width:29px;height:29px;font-size:17px}
  .mast .english{font-size:10px}
  .home{grid-template-columns:minmax(0,1fr);gap:33px;padding:34px 0 40px}
  .home h1{font-size:clamp(39px,10vw,58px);margin-bottom:17px}
  .home .kicker{margin-bottom:14px}
  .lead{font-size:16px;margin-bottom:18px}
  .facts{margin-bottom:19px;padding-block:11px}
  .home .primary{min-width:0;width:100%;max-width:418px;min-height:49px}
  .cover{width:min(100%,380px)}
  .cover-caption strong{font-size:30px}
  .site-foot{min-height:56px}
  .site-foot .english{display:none}
  .quiz{padding:25px 0 35px}
  .question-box{margin-top:18px}
  .result{padding:29px 0 38px}
  .result-top{grid-template-columns:1fr;gap:26px;margin-bottom:34px}
  .result-head h1{margin-bottom:10px}
  .result-head blockquote{margin-bottom:17px}
  .detail-grid{grid-template-columns:1fr}
}
@media(max-width:350px){
  .home h1{font-size:clamp(31px,11vw,39px)}
  .facts{font-size:13px;flex-wrap:wrap;row-gap:4px}
  .facts li{padding-inline:6px}
  .facts strong{font-size:17px;margin-right:2px}
  .result-actions>*{width:100%}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

  reasonsFor(person, report.scores).forEach(({name,score,behavior,link}) => {
    const li = make('li');
    li.append(make('strong',name + ' ' + score + ' 分。'),document.createTextNode('你' + behavior + '。' + link));
    $('reasons').append(li);
  });
  $('axes').textContent = '';
  report.scores.forEach((score,i) => {
    const name = AXES[i][0];
    const item = make('li');
    item.className = 'axis';
    const meter = make('meter');
    meter.min = 0;
    meter.max = 100;
    meter.value = score;
    meter.setAttribute('aria-label',name);
    item.append(make('span',name),meter,make('span',String(score)));
    $('axes').append(item);
  });
  $('scene').textContent = '';
  person.scene.forEach(line => {
    const [speaker, dialogue] = line.split('｜');
    const quote = make('p');
    quote.append(make('b',speaker + '：'),document.createTextNode(dialogue));
    $('scene').append(quote);
  });
  const card = $('card');
  paintCard(card,person,match);
  card.setAttribute('aria-label',person.name + '人格卡，' + person.symbol + '插画。关键词：' + person.tags.join('、') + '。趣味匹配指数 ' + match + '，满分 100。');
  show('result',focus ? 'result-name' : undefined);
}
function toast(message) {
  clearTimeout(toastTimer);
  $('toast').hidden = false;
  $('toast').textContent = message;
  toastTimer = setTimeout(() => { $('toast').hidden = true; },3100);
}
function openModal(title, value, isImage) {
  opener = document.activeElement;
  $('modal-title').textContent = title;
  $('save-preview').hidden = !isImage;
  $('copy-preview').hidden = isImage;
  if (isImage) $('save-preview').src = value;
  else $('copy-preview').value = value;
  $('overlay').hidden = false;
  document.body.style.overflow = 'hidden';
  if (isImage) $('close-overlay').focus();
  else {
    $('copy-preview').focus();
    $('copy-preview').select();
  }
}
function closeModal() {
  $('overlay').hidden = true;
  document.body.style.overflow = '';
  $('save-preview').removeAttribute('src');
  $('copy-preview').value = '';
  if (opener) opener.focus();
}
async function copyText(value, label) {
  try {
    if (!navigator.clipboard?.writeText) throw new Error('Clipboard API unavailable');
    await navigator.clipboard.writeText(value);
    toast(label);
    return;
  } catch {
    const input = make('textarea');
    const active = document.activeElement;
    input.value = value;
    input.readOnly = true;
    input.style.cssText = 'position:fixed;left:0;top:0;opacity:0;pointer-events:none';
    document.body.append(input);
    input.select();
    input.setSelectionRange(0,value.length);
    let copied = false;
    try { copied = document.execCommand('copy'); } catch {}
    input.remove();
    if (active) active.focus({preventScroll:true});
    if (copied) toast(label);
    else openModal('选中下方文字，手动复制。',value,false);
  }
}
function shareableUrl() {
  const url = new URL(location.href);
  const local = /^(localhost|127(?:\.\d{1,3}){3}|0\.0\.0\.0|\[::1\])$/i;
  if (!['http:','https:'].includes(url.protocol) || local.test(url.hostname)) return '';
  url.hash = '';
  return url.href;
}
async function invite() {
  const url = shareableUrl();
  if (!url) {
    await copyText('来测《你容易吸引什么样的恋人》！40 个生活小选择，测出你的恋爱吸引力。','已复制邀请文案。本地文件没有可分享的网址。');
    return;
  }
  if (typeof navigator.share === 'function') {
    try {
      await navigator.share({title:'你容易吸引什么样的恋人？',text:'40 个生活小选择，来比比你的恋爱吸引力。',url});
      return;
    } catch (error) {
      if (error.name === 'AbortError') return;
    }
  }
  await copyText(url,'测试链接已复制。');
}
function saveCard() {
  const canvas = $('card');
  const filename = '心动来信-' + report.ranked[0].person.name + '.png';
  const showImage = () => openModal('长按图片，选择保存到相册。',canvas.toDataURL('image/png'),true);
  const mobileWebView = /MicroMessenger|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (mobileWebView || !canvas.toBlob || !('download' in make('a'))) {
    showImage();
    return;
  }
  canvas.toBlob(blob => {
    if (!blob) {
      showImage();
      return;
    }
    const url = URL.createObjectURL(blob);
    const link = make('a');
    link.href = url;
    link.download = filename;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url),30000);
    toast('已发出高清 PNG 下载。');
  }, 'image/png');
}
function startFresh() {
  answers = Array(total).fill(null);
  index = 0;
  report = null;
  if (location.hash) {
    try { history.replaceState(null,'',location.href.split('#')[0]); } catch {}
  }
  remember();
  renderQuestion();
}

for (let i=0; i<4; i++) {
  const button = make('button');
  button.type = 'button';
  button.className = 'option';
  button.append(make('b','ABCD'[i]),make('span'));
  button.addEventListener('click',() => choose(i));
  questionOptions.push(button);
  $('options').append(button);
}
$('start').addEventListener('click',() => {
  if (complete()) renderResult();
  else {
    remember();
    renderQuestion();
  }
});
$('home-button').addEventListener('click',home);
$('previous').addEventListener('click',() => step(-1));
$('next').addEventListener('click',() => step(1));
$('restart').addEventListener('click',startFresh);
$('save').addEventListener('click',saveCard);
$('copy').addEventListener('click',() => copyText(report.ranked[0].person.share, '分享文案已复制。'));
$('invite').addEventListener('click',invite);
$('see-details').addEventListener('click',event => {
  event.preventDefault();
  $('analysis').focus({preventScroll:true});
  $('analysis').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
});
$('close-overlay').addEventListener('click',closeModal);
$('overlay').addEventListener('click',event => { if (event.target === $('overlay')) closeModal(); });
document.addEventListener('keydown',event => {
  if (!$('overlay').hidden && event.key === 'Escape') closeModal();
  if (!$('overlay').hidden && event.key === 'Tab') {
    event.preventDefault();
    const close = $('close-overlay');
    const input = $('copy-preview');
    if (!input.hidden && document.activeElement === close) input.focus();
    else close.focus();
  }
});
restore();
if (complete()) renderResult(false);
else if (answers.some(value => value !== null)) {
  remember();
  renderQuestion();
}
</script>
